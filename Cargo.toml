[package]
name = "wlrix-greeter"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "wlRIX greetd greeter — IRIX-style login screen for the wlRIX desktop."
repository = "https://github.com/wlrix/wlrix-greeter"
publish = false

[dependencies]
calloop = "0.13"
# The shared UI crate: the canvas, the Motif bevel and widgets, the fonts and the palette.
# Pinned by rev rather than taken by path, so this repo still builds from a fresh standalone
# clone. `just link-ui` in `wlrix-epoch` patches in a sibling checkout while working on both
# sides at once.
wlrix-ui = { git = "https://github.com/wlRIX/wlrix-ui", rev = "027d64ff3ce14aae345c6a3953c9c1ef45a132eb" }
# The user pictures. Not `wlrix-ui`'s decoder, which reads PNG only: an account picture is
# often the JPEG a `~/.face` holds. The same crate and features `wlrix-lock` reads the same
# files with -- PNG and JPEG are what AccountsService and `~/.face` hold in practice.
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg"] }
greetd_ipc = { version = "0.10.3", default-features = false, features = ["sync-codec"] }
libc = "0.2.186"
smithay-client-toolkit = "0.19"
wayland-client = "0.31"
# greetd IPC client + a UI toolkit get added here when login work starts. Kept
# dependency-free for the initial scaffold so `cargo build` works offline.
# greetd_ipc = "0.10"
